<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BPJS Visit Type Prediction</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
  <link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
  <style>
    body {
      font-family: Arimo, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .login {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      font-family: Pacifico, cursive;
      color: #2c3e50;
    }
    select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #2980b9;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    table, th, td {
      border: 1px solid #ddd;
    }
    th, td {
      text-align: left;
      padding: 8px;
    }
    th {
      background-color: #f2f2f2;
    }
    .prediction-results {
      margin-top: 20px;
      padding: 15px;
      background-color: #ecf0f1;
      border-radius: 5px;
    }
    .prediction-results h3 {
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="login">
    <h1>BPJS Visit Type Prediction</h1>

    <!-- Main Input Form -->
    <form action="/predict" method="POST">
      <label for="Nama_Provinsi">Pilih Provinsi:</label>
      <select name="Nama_Provinsi" id="Nama_Provinsi" required>
          <option value="">-- Pilih Provinsi --</option>
          {% for provinsi in provinsi_list %}
              <option value="{{ provinsi }}" {% if provinsi == Nama_Provinsi %}selected{% endif %}>{{ provinsi }}</option>
          {% endfor %}
      </select>
      <br><br>
  
      <label for="Jenis_Poliklinik">Pilih Jenis Poliklinik:</label>
      <select name="Jenis_Poliklinik" id="Jenis_Poliklinik" required>
          <option value="">-- Pilih Jenis Poliklinik --</option>
          {% for poliklinik in poliklinik_list %}
              <option value="{{ poliklinik }}" {% if poliklinik == Jenis_Poliklinik %}selected{% endif %}>{{ poliklinik }}</option>
          {% endfor %}
      </select>
      <br><br>
  
      <label for="Nama_Diagnosis">Pilih Diagnosis:</label>
      <select name="Nama_Diagnosis" id="Nama_Diagnosis" required>
          <option value="">-- Pilih Diagnosis --</option>
          {% for diagnosis in diagnosis_list %}
              <option value="{{ diagnosis }}" {% if diagnosis == Nama_Diagnosis %}selected{% endif %}>{{ diagnosis }}</option>
          {% endfor %}
      </select>
      <br><br>
  
      <label for="Jenis_Kunjungan">Pilih Jenis Kunjungan:</label>
      <select name="Jenis_Kunjungan" id="Jenis_Kunjungan" required>
          <option value="">-- Pilih Jenis Kunjungan --</option>
          {% for jenis in jenis_kunjungan_list %}
              <option value="{{ jenis }}" {% if jenis == Jenis_Kunjungan %}selected{% endif %}>{{ jenis }}</option>
          {% endfor %}
      </select>
      <br><br>
  
      <button type="submit">Prediksi</button>
    </form>
  

    <br><br>
    {% if prediction_results %}
      <div class="prediction-results">
        <h3>Prediction Results:</h3>
        <table>
          <tr>
            <th>Visit Type</th>
            <th>Number of Patients</th>
          </tr>
          {% for visit_type, count in prediction_results.items() %}
          <tr>
            <td>{{ visit_type }}</td>
            <td>{{ count }} kunjungan</td>
          </tr>
          {% endfor %}
        </table>
      </div>
    {% endif %}
  </div>
</body>
</html>
